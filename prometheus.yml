# prometheus.yml
# Prometheus configuration for Nova

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nova-app'
    static_configs:
      - targets: ['host.docker.internal:8000']

  - job_name: 'nova-postgres'
    static_configs:
      - targets: ['postgres:9187']

  - job_name: 'nova-redis'
    static_configs:
      - targets: ['redis:9121']